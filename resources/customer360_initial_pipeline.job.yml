resources:
  jobs:
    customer360_initial_pipeline:
      name: customer360_initial_pipeline
      tasks:
        - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/01_staging_validation.py
            base_parameters:
              ENTITY: ALL
              LOAD_TYPE: INITIAL
              STRICT_INITIAL_COUNTS: "false"
        - task_key: bronze_customers
          depends_on:
            - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
            base_parameters:
              ENTITY: customers
              LOAD_TYPE: INITIAL
              PIPELINE_RUN_ID: "{{job.run_id}}"
        - task_key: bronze_addresses
          depends_on:
            - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
            base_parameters:
              ENTITY: addresses
              LOAD_TYPE: INITIAL
              PIPELINE_RUN_ID: "{{job.run_id}}"
        - task_key: bronze_subscriptions
          depends_on:
            - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
            base_parameters:
              ENTITY: subscriptions
              LOAD_TYPE: INITIAL
              PIPELINE_RUN_ID: "{{job.run_id}}"
        - task_key: bronze_products
          depends_on:
            - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
            base_parameters:
              ENTITY: products
              LOAD_TYPE: INITIAL
              PIPELINE_RUN_ID: "{{job.run_id}}"
        - task_key: bronze_orders
          depends_on:
            - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
            base_parameters:
              ENTITY: orders
              LOAD_TYPE: INITIAL
              PIPELINE_RUN_ID: "{{job.run_id}}"
        - task_key: bronze_order_items
          depends_on:
            - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
            base_parameters:
              ENTITY: order_items
              LOAD_TYPE: INITIAL
              PIPELINE_RUN_ID: "{{job.run_id}}"
        - task_key: bronze_payments
          depends_on:
            - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
            base_parameters:
              ENTITY: payments
              LOAD_TYPE: INITIAL
              PIPELINE_RUN_ID: "{{job.run_id}}"
        - task_key: bronze_support_tickets
          depends_on:
            - task_key: staging_validation
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
            base_parameters:
              ENTITY: support_tickets
              LOAD_TYPE: INITIAL
              PIPELINE_RUN_ID: "{{job.run_id}}"
        - task_key: bronze_reconciliation
          depends_on:
            - task_key: bronze_products
            - task_key: bronze_addresses
            - task_key: bronze_payments
            - task_key: bronze_subscriptions
            - task_key: bronze_order_items
            - task_key: bronze_customers
            - task_key: bronze_orders
            - task_key: bronze_support_tickets
          notebook_task:
            notebook_path: ../notebooks/03_bronze_reconciliation.py
            base_parameters:
              ENTITY: ALL
        - task_key: silver_customers
          depends_on:
            - task_key: bronze_reconciliation
          notebook_task:
            notebook_path: ../notebooks/04_silver_entity_processing.py
            base_parameters:
              ENTITY: customers
              MODE: INITIAL
        - task_key: reconcile_customers
          depends_on:
            - task_key: silver_customers
          notebook_task:
            notebook_path: ../notebooks/05_silver_reconciliation.py
            base_parameters:
              ENTITY: customers
              MODE: INITIAL
        - task_key: silver_products
          depends_on:
            - task_key: bronze_reconciliation
          notebook_task:
            notebook_path: ../notebooks/04_silver_entity_processing.py
            base_parameters:
              ENTITY: products
              MODE: INITIAL
        - task_key: reconcile_products
          depends_on:
            - task_key: silver_products
          notebook_task:
            notebook_path: ../notebooks/05_silver_reconciliation.py
            base_parameters:
              ENTITY: products
              MODE: INITIAL
        - task_key: silver_addresses
          depends_on:
            - task_key: reconcile_customers
          notebook_task:
            notebook_path: ../notebooks/04_silver_entity_processing.py
            base_parameters:
              ENTITY: addresses
              MODE: INITIAL
        - task_key: reconcile_addresses
          depends_on:
            - task_key: silver_addresses
          notebook_task:
            notebook_path: ../notebooks/05_silver_reconciliation.py
            base_parameters:
              ENTITY: addresses
              MODE: INITIAL
        - task_key: silver_subscriptions
          depends_on:
            - task_key: reconcile_customers
          notebook_task:
            notebook_path: ../notebooks/04_silver_entity_processing.py
            base_parameters:
              ENTITY: subscriptions
              MODE: INITIAL
        - task_key: reconcile_subscriptions
          depends_on:
            - task_key: silver_subscriptions
          notebook_task:
            notebook_path: ../notebooks/05_silver_reconciliation.py
            base_parameters:
              ENTITY: subscriptions
              MODE: INITIAL
        - task_key: customer_scd2_baseline
          depends_on:
            - task_key: reconcile_customers
          notebook_task:
            notebook_path: ../notebooks/09_customer_scd2.py
            base_parameters:
              MODE: BASELINE
        - task_key: silver_orders
          depends_on:
            - task_key: reconcile_customers
            - task_key: reconcile_addresses
          notebook_task:
            notebook_path: ../notebooks/04_silver_entity_processing.py
            base_parameters:
              ENTITY: orders
              MODE: INITIAL
        - task_key: reconcile_orders
          depends_on:
            - task_key: silver_orders
          notebook_task:
            notebook_path: ../notebooks/05_silver_reconciliation.py
            base_parameters:
              ENTITY: orders
              MODE: INITIAL
        - task_key: silver_order_items
          depends_on:
            - task_key: reconcile_orders
            - task_key: reconcile_products
          notebook_task:
            notebook_path: ../notebooks/04_silver_entity_processing.py
            base_parameters:
              ENTITY: order_items
              MODE: INITIAL
        - task_key: reconcile_order_items
          depends_on:
            - task_key: silver_order_items
          notebook_task:
            notebook_path: ../notebooks/05_silver_reconciliation.py
            base_parameters:
              ENTITY: order_items
              MODE: INITIAL
        - task_key: silver_payments
          depends_on:
            - task_key: reconcile_orders
          notebook_task:
            notebook_path: ../notebooks/04_silver_entity_processing.py
            base_parameters:
              ENTITY: payments
              MODE: INITIAL
        - task_key: reconcile_payments
          depends_on:
            - task_key: silver_payments
          notebook_task:
            notebook_path: ../notebooks/05_silver_reconciliation.py
            base_parameters:
              ENTITY: payments
              MODE: INITIAL
        - task_key: silver_support_tickets
          depends_on:
            - task_key: reconcile_customers
            - task_key: reconcile_orders
          notebook_task:
            notebook_path: ../notebooks/04_silver_entity_processing.py
            base_parameters:
              ENTITY: support_tickets
              MODE: INITIAL
        - task_key: reconcile_support_tickets
          depends_on:
            - task_key: silver_support_tickets
          notebook_task:
            notebook_path: ../notebooks/05_silver_reconciliation.py
            base_parameters:
              ENTITY: support_tickets
              MODE: INITIAL
        - task_key: gold_build
          depends_on:
            - task_key: customer_scd2_baseline
            - task_key: reconcile_addresses
            - task_key: reconcile_payments
            - task_key: reconcile_order_items
            - task_key: reconcile_support_tickets
            - task_key: reconcile_subscriptions
            - task_key: reconcile_orders
            - task_key: reconcile_products
          notebook_task:
            notebook_path: ../notebooks/10_gold_build.py
        - task_key: reconciliation_archive
          depends_on:
            - task_key: gold_build
          notebook_task:
            notebook_path: ../notebooks/11_reconciliation_archive.py
            base_parameters:
              PIPELINE_RUN_ID: "{{job.run_id}}"
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
