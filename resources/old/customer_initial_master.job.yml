resources:
  jobs:
    customer360_initial_master_pipeline:
      name: "customer360_initial_master_pipeline"
      tasks:
        - task_key: Staging
          run_job_task:
            job_id: ${resources.jobs.Customer_Staging.id}

        - task_key: bronze_layer
          depends_on:
            - task_key: Staging
          run_job_task:
            job_id: ${resources.jobs.Customer_BRONZE_JOB.id}

        - task_key: silver_layer
          depends_on:
            - task_key: bronze_layer
          run_job_task:
            job_id: ${resources.jobs.Customer_SILVER_JOB.id}

        - task_key: gold_layer
          depends_on:
            - task_key: silver_layer
          run_job_task:
            job_id: ${resources.jobs.Customer_gold_job.id}
