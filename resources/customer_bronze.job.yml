resources:
  jobs:
    Customer_BRONZE_JOB:
      name: "Customer_BRONZE JOB"
      tasks:
        - task_key: Customer_raw
          notebook_task:
            notebook_path: ../notebooks/04_bronze_customers_initial_load.ipynb

        - task_key: all_table_load
          notebook_task:
            notebook_path: ../notebooks/05_bronze_initial_load_all.ipynb

        - task_key: reconcile_All_tables
          depends_on:
            - task_key: Customer_raw
            - task_key: all_table_load
          notebook_task:
            notebook_path: ../notebooks/06_bronze_reconciliation.ipynb
